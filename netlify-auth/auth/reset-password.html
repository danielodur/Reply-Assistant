<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reply Assistant — Reset password</title>
    <link rel="stylesheet" href="./shared.css" />
    <script src="./config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./shared.js"></script>
  </head>
  <body>
    <canvas id="fireworks" class="hidden"></canvas>
    <div class="card">
      <div class="card-content">
        <button type="button" class="lang-toggle" id="lang-toggle"></button>
        <div class="logo" aria-hidden="true"><span class="logo-inner">RA</span></div>
        <div id="state-loading">
          <h1 id="title-loading"></h1>
          <div class="spinner" aria-hidden="true"></div>
        </div>
        <form id="state-form" class="hidden">
          <h1 id="title-form"></h1>
          <p id="subtitle-form"></p>
          <div class="field">
            <label for="password" id="label-password"></label>
            <div class="password-wrap">
              <input id="password" type="password" autocomplete="new-password" required />
              <button type="button" class="password-toggle" id="toggle-password"></button>
            </div>
            <p id="password-strength-hint" class="field-hint hidden"></p>
          </div>
          <div class="field">
            <label for="confirm" id="label-confirm"></label>
            <div class="password-wrap">
              <input id="confirm" type="password" autocomplete="new-password" required />
              <button type="button" class="password-toggle" id="toggle-confirm"></button>
            </div>
            <p id="confirm-match-hint" class="field-hint hidden"></p>
          </div>
          <p id="form-error" class="error hidden"></p>
          <button type="submit" class="btn-primary" id="submit-btn"></button>
        </form>
        <div id="state-success" class="hidden">
          <h1 id="title-success"></h1>
          <p id="body-success"></p>
          <button type="button" class="btn-primary" id="open-app"></button>
          <p id="hint-success" style="margin-top: 14px; font-size: 11px;"></p>
        </div>
        <div id="state-error" class="hidden">
          <h1 id="title-error"></h1>
          <p id="body-error"></p>
          <a class="link" id="back-error" href="reply-assistant://auth/callback"></a>
        </div>
      </div>
    </div>
    <script>
      (async function () {
        const {
          t,
          createClient,
          parseHashParams,
          buildDeepLink,
          establishSession,
          startFireworks,
          isPasswordValid,
          wirePasswordToggle,
          renderPasswordStrengthHint,
          renderPasswordMatchHint,
          mountLanguageToggle,
        } = window.AuthPages;

        const loading = document.getElementById('state-loading');
        const form = document.getElementById('state-form');
        const success = document.getElementById('state-success');
        const error = document.getElementById('state-error');
        const formError = document.getElementById('form-error');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirm');

        let errorMessage = '';
        let successSession = null;
        let openHandlerAttached = false;
        let togglesWired = false;

        function renderLoading() {
          document.getElementById('title-loading').textContent = t('loadingRecovery');
        }

        function renderFormLabels() {
          document.getElementById('title-form').textContent = t('resetTitle');
          document.getElementById('subtitle-form').textContent = t('resetSubtitle');
          document.getElementById('label-password').textContent = t('newPassword');
          document.getElementById('label-confirm').textContent = t('confirmPassword');
          document.getElementById('submit-btn').textContent = t('updatePassword');
          renderPasswordStrengthHint('password-strength-hint', passwordInput.value);
          renderPasswordMatchHint('confirm-match-hint', passwordInput.value, confirmInput.value);
        }

        function renderSuccess() {
          document.getElementById('title-success').textContent = t('welcomeBack');
          document.getElementById('body-success').textContent = t('passwordUpdated');
          document.getElementById('hint-success').textContent = t('openAppHint');
          const openBtn = document.getElementById('open-app');
          openBtn.textContent = t('openAppSignIn');
          if (!openHandlerAttached && successSession) {
            openBtn.addEventListener('click', () => {
              window.location.href = buildDeepLink(successSession, 'recovery');
            });
            openHandlerAttached = true;
          }
        }

        function renderErrorState() {
          document.getElementById('title-error').textContent = t('errorTitle');
          document.getElementById('body-error').textContent = errorMessage || t('errorBody');
          document.getElementById('back-error').textContent = t('backToApp');
        }

        function refreshVisibleCopy() {
          if (!loading.classList.contains('hidden')) {
            renderLoading();
            return;
          }
          if (!form.classList.contains('hidden')) {
            renderFormLabels();
            return;
          }
          if (!success.classList.contains('hidden')) {
            renderSuccess();
            return;
          }
          if (!error.classList.contains('hidden')) {
            renderErrorState();
          }
        }

        mountLanguageToggle('lang-toggle', refreshVisibleCopy);
        renderLoading();

        function showError(message) {
          errorMessage = message || t('errorBody');
          loading.classList.add('hidden');
          form.classList.add('hidden');
          success.classList.add('hidden');
          error.classList.remove('hidden');
          renderErrorState();
        }

        try {
          const client = createClient();
          const session = await establishSession(client);
          if (!session) throw new Error(t('errorBody'));

          loading.classList.add('hidden');
          form.classList.remove('hidden');
          renderFormLabels();

          if (!togglesWired) {
            wirePasswordToggle('password', 'toggle-password');
            wirePasswordToggle('confirm', 'toggle-confirm');
            passwordInput.addEventListener('input', () => {
              renderPasswordStrengthHint('password-strength-hint', passwordInput.value);
              renderPasswordMatchHint('confirm-match-hint', passwordInput.value, confirmInput.value);
            });
            confirmInput.addEventListener('input', () => {
              renderPasswordMatchHint('confirm-match-hint', passwordInput.value, confirmInput.value);
            });
            togglesWired = true;
          }

          form.addEventListener('submit', async (event) => {
            event.preventDefault();
            formError.classList.add('hidden');
            const password = passwordInput.value;
            const confirm = confirmInput.value;
            if (!isPasswordValid(password)) {
              formError.textContent = t('weak');
              formError.classList.remove('hidden');
              return;
            }
            if (password !== confirm) {
              formError.textContent = t('mismatch');
              formError.classList.remove('hidden');
              return;
            }
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.textContent = t('working');
            const { error: updateError } = await client.auth.updateUser({ password });
            btn.disabled = false;
            btn.textContent = t('updatePassword');
            if (updateError) {
              formError.textContent = updateError.message;
              formError.classList.remove('hidden');
              return;
            }

            const { data: refreshed } = await client.auth.getSession();
            successSession = refreshed.session || session;

            form.classList.add('hidden');
            success.classList.remove('hidden');
            renderSuccess();

            document.getElementById('fireworks').classList.remove('hidden');
            startFireworks(document.getElementById('fireworks'));
          });
        } catch (err) {
          const hash = parseHashParams();
          showError(hash.get('error_description') || err?.message);
        }
      })();
    </script>
  </body>
</html>
